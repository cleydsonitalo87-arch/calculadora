<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora</title>
<style>
  :root {
    --bg: #eef0f6;
    --card: #ffffff;
    --text: #1b1d2a;
    --muted: #7a7f93;
    --key: #f2f3f8;
    --key-hover: #e6e8f1;
    --op: #e8e6ff;
    --op-text: #5b4bdb;
    --accent: #6c5ce7;
    --accent-hover: #5a4bd1;
    --accent-text: #ffffff;
    --danger: #e5484d;
    --shadow: 0 20px 50px rgba(60, 60, 110, .18);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131a;
      --card: #1c1e29;
      --text: #f1f2f7;
      --muted: #8b90a5;
      --key: #262938;
      --key-hover: #2f3345;
      --op: #2c2850;
      --op-text: #b4a9ff;
      --accent: #7c6df0;
      --accent-hover: #8f82f5;
      --shadow: 0 20px 50px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131a;
    --card: #1c1e29;
    --text: #f1f2f7;
    --muted: #8b90a5;
    --key: #262938;
    --key-hover: #2f3345;
    --op: #2c2850;
    --op-text: #b4a9ff;
    --accent: #7c6df0;
    --accent-hover: #8f82f5;
    --shadow: 0 20px 50px rgba(0, 0, 0, .5);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .calc {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border-radius: 28px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .display {
    min-height: 110px;
    padding: 12px 8px 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
  }
  .history {
    color: var(--muted);
    font-size: 15px;
    min-height: 20px;
    margin-bottom: 6px;
    max-width: 100%;
    overflow-x: auto;
    white-space: nowrap;
  }
  .value {
    font-size: 52px;
    font-weight: 600;
    letter-spacing: -1px;
    line-height: 1.1;
    max-width: 100%;
    white-space: nowrap;
    overflow-x: auto;
    font-variant-numeric: tabular-nums;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: 0;
    border-radius: 18px;
    height: 64px;
    font: inherit;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    background: var(--key);
    cursor: pointer;
    transition: background .15s, transform .08s;
  }
  button:hover { background: var(--key-hover); }
  button:active { transform: scale(.94); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.op { background: var(--op); color: var(--op-text); font-size: 26px; }
  button.op:hover { filter: brightness(.96); }
  button.op.active { background: var(--accent); color: var(--accent-text); }
  button.fn { color: var(--op-text); }
  button.clear { color: var(--danger); }
  button.eq { background: var(--accent); color: var(--accent-text); font-size: 28px; }
  button.eq:hover { background: var(--accent-hover); }
  button.zero { grid-column: span 2; }
  @media (max-width: 360px) {
    button { height: 56px; }
    .value { font-size: 44px; }
  }
</style>
</head>
<body>
  <main class="calc" aria-label="Calculadora">
    <div class="display" aria-live="polite">
      <div class="history" id="history"></div>
      <div class="value" id="value">0</div>
    </div>
    <div class="keys">
      <button class="fn clear" data-action="clear">AC</button>
      <button class="fn" data-action="sign" aria-label="Inverter sinal">±</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/" aria-label="Dividir">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*" aria-label="Multiplicar">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-" aria-label="Subtrair">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+" aria-label="Somar">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-action="dot">,</button>
      <button class="eq" data-action="equals" aria-label="Igual">=</button>
    </div>
  </main>

<script>
  const valueEl = document.getElementById('value');
  const historyEl = document.getElementById('history');
  const opButtons = document.querySelectorAll('button[data-op]');
  const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = false;
  let error = false;

  function format(str) {
    if (error) return 'Erro';
    const negative = str.startsWith('-');
    const clean = negative ? str.slice(1) : str;
    const [int, dec] = clean.split('.');
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (negative ? '-' : '') + grouped + (dec !== undefined ? ',' + dec : '');
  }

  function render() {
    valueEl.textContent = format(current);
    const len = valueEl.textContent.length;
    valueEl.style.fontSize = len > 12 ? '30px' : len > 9 ? '40px' : '';
    historyEl.textContent = operator && previous !== null
      ? format(previous) + ' ' + symbols[operator]
      : '';
    opButtons.forEach(b => b.classList.toggle('active', b.dataset.op === operator && overwrite));
  }

  function reset() {
    current = '0'; previous = null; operator = null; overwrite = false; error = false;
  }

  function inputNumber(n) {
    if (error) reset();
    if (overwrite) { current = '0'; overwrite = false; }
    if (current.replace(/[-.]/g, '').length >= 15) return;
    current = current === '0' ? n : current === '-0' ? '-' + n : current + n;
    render();
  }

  function inputDot() {
    if (error) reset();
    if (overwrite) { current = '0'; overwrite = false; }
    if (!current.includes('.')) current += '.';
    render();
  }

  function compute(a, b, op) {
    const x = parseFloat(a), y = parseFloat(b);
    let r;
    switch (op) {
      case '+': r = x + y; break;
      case '-': r = x - y; break;
      case '*': r = x * y; break;
      case '/': if (y === 0) return null; r = x / y; break;
    }
    return String(parseFloat(r.toPrecision(12)));
  }

  function chooseOperator(op) {
    if (error) return;
    if (operator && previous !== null && !overwrite) {
      const result = compute(previous, current, operator);
      if (result === null) { error = true; operator = null; previous = null; render(); return; }
      previous = result;
      current = result;
    } else {
      previous = current;
    }
    operator = op;
    overwrite = true;
    render();
  }

  function equals() {
    if (error || !operator || previous === null) return;
    const result = compute(previous, current, operator);
    if (result === null) { error = true; } else { current = result; }
    historyEl.textContent = '';
    previous = null; operator = null; overwrite = true;
    valueEl.textContent = format(current);
    historyEl.textContent = '';
    opButtons.forEach(b => b.classList.remove('active'));
  }

  function toggleSign() {
    if (error) return;
    if (current !== '0') current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  function percent() {
    if (error) return;
    current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    overwrite = true;
    render();
  }

  function backspace() {
    if (error || overwrite) return;
    current = current.length > 1 && !(current.length === 2 && current.startsWith('-'))
      ? current.slice(0, -1) : '0';
    render();
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.num !== undefined) inputNumber(btn.dataset.num);
    else if (btn.dataset.op) chooseOperator(btn.dataset.op);
    else switch (btn.dataset.action) {
      case 'clear': reset(); render(); break;
      case 'sign': toggleSign(); break;
      case 'percent': percent(); break;
      case 'dot': inputDot(); break;
      case 'equals': equals(); break;
    }
  });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) inputNumber(e.key);
    else if (e.key === ',' || e.key === '.') inputDot();
    else if ('+-*/'.includes(e.key)) { e.preventDefault(); chooseOperator(e.key); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape' || e.key === 'Delete') { reset(); render(); }
    else if (e.key === '%') percent();
  });

  render();
</script>
</body>
</html>
